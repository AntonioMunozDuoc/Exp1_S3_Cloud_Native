name: CI-CD Microservices

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup JDK 21 (pedidoservice usa Java 21; guiaservice compila dentro de su Dockerfile con JDK 17)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build y Push Pedido Service
      - name: Build and Push Pedido Service
        uses: docker/build-push-action@v6
        with:
          context: ./pedidoservice
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pedidoservice:latest

      # Build y Push Guia Service
      - name: Build and Push Guia Service
        uses: docker/build-push-action@v6
        with:
          context: ./guiaservice
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/guiaservice:latest

      # Configurar llave SSH
      - name: Add SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Deploy automático en EC2
      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }} << EOF

            # Login DockerHub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # =========================
            # PEDIDO SERVICE
            # =========================

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/pedidoservice:latest

            docker stop pedidoservice || true
            docker rm pedidoservice || true

            docker run -d \
              --name pedidoservice \
              -p 8082:8082 \
              --restart always \
              ${{ secrets.DOCKERHUB_USERNAME }}/pedidoservice:latest

            # =========================
            # GUIA SERVICE
            # =========================

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/guiaservice:latest

            docker stop guiaservice || true
            docker rm guiaservice || true

            # AJUSTE 2: Agregado el volumen -v /mnt/efs:/mnt/efs
            docker run -d \
            --name guiaservice \
            -p 8083:8083 \
            -v /mnt/efs:/mnt/efs \
            --restart always \
            -e AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }} \
            -e AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }} \
            -e AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }} \
            -e AWS_REGION=${{ secrets.AWS_REGION }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/guiaservice:latest

            # Mostrar contenedores activos
            docker ps

          EOF